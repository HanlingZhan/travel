<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2563eb" />
<title>🐼 成都旅行助手 · 10天9晚</title>
<style>
  :root{
    --blue:#2563eb; --blue2:#3b82f6; --sky:#60a5fa; --soft:#eff6ff;
    --ink:#1e293b; --mut:#64748b; --line:#dbeafe; --card:#ffffff;
    --hi:#ef4444; --mid:#f59e0b; --lo:#10b981;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#dbeafe 0%,#eff6ff 40%,#f8fafc 100%);
    color:var(--ink); max-width:520px; margin:0 auto; min-height:100vh;
    padding-bottom:90px;
  }
  /* ---- top app bar ---- */
  .appbar{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(135deg,var(--blue) 0%,var(--sky) 100%);
    color:#fff; padding:14px 16px 12px; border-radius:0 0 26px 26px;
    box-shadow:0 6px 18px rgba(37,99,235,.28);
  }
  .appbar .top{display:flex; align-items:center; gap:10px;}
  .panda{
    width:42px; height:42px; border-radius:50%; background:#fff; position:relative; flex:0 0 42px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .panda::before,.panda::after{
    content:""; position:absolute; top:-7px; width:15px; height:15px; border-radius:50%;
    background:#1f2937;
  }
  .panda::before{left:4px;} .panda::after{right:4px;}
  .panda .eye{position:absolute; top:13px; width:9px; height:11px; border-radius:50%; background:#1f2937;}
  .panda .eye.l{left:9px;} .panda .eye.r{right:9px;}
  .panda .nose{position:absolute; top:24px; left:50%; transform:translateX(-50%); width:7px; height:5px; border-radius:50%; background:#1f2937;}
  .appbar h1{font-size:18px; margin:0; font-weight:800; letter-spacing:.5px;}
  .appbar .sub{font-size:12px; opacity:.9; margin-top:2px;}
  .countdown{
    margin-top:10px; background:rgba(255,255,255,.18); border-radius:14px;
    padding:8px 12px; font-size:13px; display:flex; align-items:center; gap:8px; backdrop-filter:blur(4px);
  }
  .countdown b{font-size:16px;}

  /* ---- hotel card ---- */
  .hotel{
    margin:14px; background:var(--card); border-radius:20px; padding:14px;
    box-shadow:0 4px 14px rgba(37,99,235,.10); border:1px solid var(--line);
  }
  .hotel h2{margin:0 0 8px; font-size:15px; display:flex; align-items:center; gap:6px;}
  .hotel .row{display:flex; gap:8px;}
  .hotel input{
    flex:1; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px;
    font-size:14px; outline:none; background:var(--soft); color:var(--ink);
  }
  .hotel input:focus{border-color:var(--blue2); background:#fff;}
  .btn{
    border:none; border-radius:12px; padding:10px 14px; font-size:14px; font-weight:700;
    background:var(--blue); color:#fff; cursor:pointer; white-space:nowrap;
  }
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:var(--soft); color:var(--blue); border:1.5px solid var(--line);}
  .hotel .saved{font-size:12px; color:var(--mut); margin-top:8px; display:flex; align-items:center; gap:6px;}
  .hotel .prov{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .chip-prov{
    font-size:12px; padding:6px 10px; border-radius:20px; border:1.5px solid var(--line);
    background:#fff; color:var(--mut); cursor:pointer;
  }
  .chip-prov.on{background:var(--blue); color:#fff; border-color:var(--blue);}

  /* ---- day chips (2 行网格) ---- */
  .days-wrap{margin:6px 0 4px;}
  .days{
    display:grid; grid-template-columns:repeat(5,1fr); gap:7px;
    padding:6px 2px 8px;
  }
  .daychip{
    text-align:center; border-radius:14px; padding:7px 2px;
    background:#fff; border:1.5px solid var(--line); color:var(--mut); cursor:pointer;
    font-size:11px;
  }
  .daychip .d{font-size:12.5px; font-weight:800; color:var(--ink);}
  .daychip .w{font-size:10px; margin-top:1px;}
  .daychip.on{background:linear-gradient(135deg,var(--blue),var(--sky)); color:#fff; border-color:transparent; box-shadow:0 4px 10px rgba(37,99,235,.3);}
  .daychip.on .d{color:#fff;}
  .daychip.on .w{color:#fff;}
  .daychip.today{outline:2.5px dashed var(--mid); outline-offset:1px;}

  /* ---- 实时天气卡片 ---- */
  .weather-live{
    margin:14px; background:linear-gradient(135deg,#3b82f6 0%,#7dd3fc 100%);
    border-radius:20px; padding:14px 16px; color:#fff;
    box-shadow:0 4px 14px rgba(37,99,235,.20); display:none;
  }
  .weather-live .wtop{display:flex; align-items:center; justify-content:space-between;}
  .weather-live .wplace{font-size:16px; font-weight:800; display:flex; align-items:center; gap:6px;}
  .weather-live .wtemp{font-size:30px; font-weight:800; line-height:1;}
  .weather-live .wsub{font-size:12px; opacity:.95; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap;}
  .weather-live .wdate{font-size:11px; opacity:.85; margin-top:5px;}
  .weather-live .wrefresh{margin-left:auto; font-size:11px; background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:20px; padding:5px 10px; cursor:pointer;}
  .weather-live .wrefresh:active{transform:scale(.96);}
  .weather-live.err{background:linear-gradient(135deg,#64748b 0%,#94a3b8 100%); box-shadow:none;}
  .weather-live .wemoji{font-size:26px;}

  /* ---- section ---- */
  .sec{margin:14px; }
  .sec-title{font-size:16px; font-weight:800; margin:0 0 10px; display:flex; align-items:center; gap:7px; color:var(--blue);}

  /* day detail card */
  .daycard{
    background:var(--card); border-radius:20px; padding:14px; border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(37,99,235,.10);
  }
  .daycard .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .daycard .date{font-size:17px; font-weight:800;}
  .daycard .weather{
    font-size:12px; background:var(--soft); color:var(--blue); padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .daycard .theme{font-size:13px; color:var(--mut); margin:2px 0 10px;}
  .wxnote{font-size:12px; background:#fff7ed; color:#c2410c; border-radius:12px; padding:7px 10px; margin-bottom:10px; display:flex; gap:6px;}

  /* timeline */
  .tl{position:relative; padding-left:26px;}
  .tl::before{content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--line);}
  .ti{position:relative; margin-bottom:14px;}
  .ti:last-child{margin-bottom:0;}
  .ti .dot{
    position:absolute; left:-22px; top:2px; width:18px; height:18px; border-radius:50%;
    background:var(--soft); border:2px solid var(--blue2); display:flex; align-items:center; justify-content:center; font-size:10px;
  }
  .ti .name{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .ti .time{font-size:11px; color:var(--blue); background:var(--soft); padding:1px 7px; border-radius:10px; font-weight:700;}
  .ti .desc{font-size:12.5px; color:var(--mut); margin-top:3px; line-height:1.55;}
  .ti .trans{
    font-size:12px; background:#eef2ff; color:#3730a3; border-radius:10px; padding:6px 9px; margin-top:6px;
    display:flex; gap:6px; align-items:flex-start;
  }
  .ti .acts{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
  .mini{
    font-size:11.5px; padding:6px 10px; border-radius:18px; border:1.5px solid var(--line);
    background:#fff; color:var(--blue); cursor:pointer; font-weight:600;
  }
  .mini:active{transform:scale(.95);}
  .mini.nav{background:var(--blue); color:#fff; border-color:var(--blue);}
  .mini.lock{background:#fef2f2; color:var(--hi); border-color:#fecaca;}
  .booktag{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:10px; margin-top:6px;
  }
  .booktag.hi{background:#fee2e2; color:var(--hi);}
  .booktag.mid{background:#fef3c7; color:#b45309;}
  .booktag.lo{background:#d1fae5; color:#047857;}

  .stay{font-size:12.5px; background:#f0f9ff; border:1px dashed var(--sky); border-radius:12px; padding:8px 10px; margin-top:10px; color:#075985;}

  /* reminders */
  .rem{
    background:var(--card); border-radius:16px; padding:12px; margin-bottom:10px; border:1px solid var(--line);
    box-shadow:0 3px 10px rgba(37,99,235,.07);
  }
  .rem .rt{display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px;}
  .rem .pr{font-size:11px; padding:2px 9px; border-radius:10px; color:#fff; font-weight:800;}
  .pr.hi{background:var(--hi);} .pr.mid{background:var(--mid);} .pr.lo{background:var(--lo);}
  .ritem{display:flex; gap:9px; padding:9px 0; border-top:1px dashed var(--line); align-items:flex-start;}
  .ritem:first-of-type{border-top:none;}
  .ritem .cb{
    flex:0 0 20px; width:20px; height:20px; border-radius:6px; border:2px solid var(--blue2); margin-top:1px;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; background:#fff; cursor:pointer;
  }
  .ritem.done .cb{background:var(--lo); border-color:var(--lo);}
  .ritem.done .txt{text-decoration:line-through; color:var(--mut);}
  .ritem .txt{font-size:13px; line-height:1.5; flex:1;}
  .ritem .meta{font-size:11.5px; color:var(--mut); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
  .ritem .meta b{color:var(--blue);}

  /* budget */
  .budget{background:var(--card); border-radius:18px; padding:6px 14px; border:1px solid var(--line); box-shadow:0 3px 10px rgba(37,99,235,.07);}
  .brow{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .brow:last-child{border-bottom:none;}
  .brow .k{color:var(--mut);}
  .brow .v{font-weight:800;}
  .brow.total{font-size:15px;}
  .brow.total .v{color:var(--blue);}

  .footer{text-align:center; font-size:11px; color:var(--mut); padding:18px 0 6px; line-height:1.7;}
  .float-tip{
    position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:40;
    background:var(--blue); color:#fff; padding:10px 18px; border-radius:24px; font-size:13px; font-weight:700;
    box-shadow:0 6px 18px rgba(37,99,235,.4); display:none; max-width:90%;
  }
  .pill-help{font-size:11px; color:var(--mut); margin-top:6px; line-height:1.5;}
</style>
</head>
<body>

<div class="appbar">
  <div class="top">
    <div class="panda"><span class="eye l"></span><span class="eye r"></span><span class="nose"></span></div>
    <div>
      <h1>成都旅行助手 🐼</h1>
      <div class="sub">10天9晚 · 8.31–9.9 · 随时看行程</div>
    </div>
  </div>
  <div class="countdown" id="countdown">🎋 计算中…</div>
</div>

<!-- 实时天气 -->
<div class="weather-live" id="weatherLive">

    <div><span class="wemoji" id="wEmoji">🌤️</span></div>
    <div style="flex:1;margin-left:10px;"><div class="wplace" id="wPlace">成都</div>
    <div class="wsub" id="wSub"></div></div>
    <div style="text-align:right;"><div class="wtemp" id="wTemp">--°</div>
    <div class="wdate" id="wDate"></div></div>
  </div>
  <div style="text-align:right;margin-top:6px;"><button class="wrefresh" onclick="refreshWeather()">🔄 刷新</button></div>
</div>

<!-- 酒店地址 -->
<div class="hotel">
  <h2>🏨 我的酒店（还没定？先空着也行）</h2>
  <div class="row">
    <input id="hotelInput" placeholder="贴上酒店地址，例如：金科星耀天都 / 昭觉寺南路…" />
    <button class="btn" onclick="saveHotel()">保存</button>
  </div>
  <div class="saved" id="savedLine"></div>
  <div class="prov">
    <span style="font-size:12px;color:var(--mut);align-self:center;">导航用：</span>
    <span class="chip-prov" data-p="apple" onclick="setProv(this)">🍎 Apple地图</span>
    <span class="chip-prov on" data-p="amap" onclick="setProv(this)">🗺️ 高德</span>
    <span class="chip-prov" data-p="baidu" onclick="setProv(this)">🅑 百度</span>
  </div>
  <div class="pill-help">填好酒店后，每个景点会出现「🧭 导航」按钮：Apple地图会从你酒店出发规划完整路线；高德/百度会直接搜出目的地（在App里再选起点即可）。</div>
</div>

<!-- 行程 -->
<div class="sec">
  <div class="sec-title">📅 每日行程 & 交通路线</div>
  <div class="days-wrap"><div class="days" id="dayChips"></div></div>
  <div id="dayDetail"></div>
</div>

<!-- 提醒 -->
<div class="sec">
  <div class="sec-title">🔔 要提前买票 / 预约的提醒</div>
  <div id="reminders"></div>
</div>

<!-- 预算 -->
<div class="sec">
  <div class="sec-title">💰 预算总览</div>
  <div class="budget" id="budget"></div>
</div>

<div class="footer">
  🐼 成都旅行助手 · 纯网页版，无需备案<br/>
  数据来自你的飞书行程文档 · 本地保存不联网
</div>

<div class="float-tip" id="tip"></div>

/* ============ 逻辑 ============ */
const $ = s=>document.querySelector(s);
let selDay = 0;

function loadState(){
  const h = localStorage.getItem('cd_hotel');
  if(h){ $('#hotelInput').value=h; showSaved(h); }
  const p = localStorage.getItem('cd_map')||'amap';
  document.querySelectorAll('.chip-prov').forEach(c=>c.classList.toggle('on', c.dataset.p===p));
  // checked reminders
  const done = JSON.parse(localStorage.getItem('cd_done')||'{}');
  Object.keys(done).forEach(k=>{ if(done[k]) document.documentElement.setAttribute('data-done-'+k,'1'); });
}

function saveHotel(){
  const v = $('#hotelInput').value.trim();
  localStorage.setItem('cd_hotel', v);
  showSaved(v);
  tip(v? '🏨 已保存：'+v : '已清空酒店地址');
  renderDay();
}
function showSaved(v){
  $('#savedLine').innerHTML = v? ('✅ 当前酒店：<b>'+escapeHtml(v)+'</b>') : '⚠️ 还没填酒店，导航按钮会提醒你先填写';
}
function setProv(el){
  document.querySelectorAll('.chip-prov').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  localStorage.setItem('cd_map', el.dataset.p);
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function navTo(name){
  const hotel = localStorage.getItem('cd_hotel')||'';
  if(!hotel){ tip('🏨 请先在顶部填写你的酒店地址哦'); $('#hotelInput').focus(); return; }
  const p = localStorage.getItem('cd_map')||'amap';
  const d = encodeURIComponent(name), s = encodeURIComponent(hotel);
  let url;
  if(p==='apple'){
    url = `https://maps.apple.com/?saddr=${s}&daddr=${d}&dirflg=r`;
  }else if(p==='amap'){
    url = `https://uri.amap.com/search?keyword=${d}&city=成都`;
  }else{
    url = `https://api.map.baidu.com/geocoder?address=${d}&output=html&src=webapp`;
  }
  window.open(url,'_blank');
}
function viewMap(name){
  const d = encodeURIComponent(name);
  const p = localStorage.getItem('cd_map')||'amap';
  let url = p==='baidu' ? `https://api.map.baidu.com/geocoder?address=${d}&output=html&src=webapp`
        : p==='amap' ? `https://uri.amap.com/search?keyword=${d}&city=成都`
        : `https://maps.apple.com/?q=${d}`;
  window.open(url,'_blank');
}
function tip(msg){ const t=$('#tip'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2200); }

/* ---- 渲染日芯片 ---- */
function renderChips(){
  const wrap = $('#dayChips'); wrap.innerHTML='';
  const today = new Date();
  const tripStart = new Date(2026,7,31), tripEnd = new Date(2026,8,9);
  const inTrip = today>=tripStart && today<=tripEnd;
  DAYS.forEach((d,i)=>{
    const el = document.createElement('div');
    el.className='daychip'+(i===selDay?' on':'')+((inTrip&&i===today.getDate? false:false));
    el.innerHTML = `<div class="d">${d.date.replace('月','/').replace('日','')}</div><div class="w">${d.w}</div>`;
    el.onclick=()=>{ selDay=i; renderChips(); renderDay(); refreshWeather(); };
    wrap.appendChild(el);
  });
}

/* ---- 渲染当日详情 ---- */
function renderDay(){
  const d = DAYS[selDay];
  const hotel = localStorage.getItem('cd_hotel')||'';
  let h = `<div class="daycard">
    <div class="head"><div class="date">📍 ${d.date} <span style="font-size:12px;color:var(--mut);font-weight:600">${d.w}</span></div>
      <div class="weather">${d.wx}</div></div>
    <div class="theme">${d.theme}</div>`;
  if(d.note) h += `<div class="wxnote">${d.note}</div>`;
  h += `<div class="tl">`;
  d.items.forEach(it=>{
    const book = it.book? BOOKS[it.book] : null;
    h += `<div class="ti"><div class="dot">${it.emoji}</div>
      <div class="name">${it.time?`<span class="time">${it.time}</span>`:''}${it.name}</div>`;
    if(it.desc) h += `<div class="desc">${it.desc}</div>`;
    if(it.type==='trans') h += `<div class="trans">🚇 <span>${hotel?('从【'+escapeHtml(hotel)+'】出发 · '):''}${it.desc.replace(/（从你酒店出发的精确路线见🧭）/,'')}</span></div>`;
    // buttons
    let acts='<div class="acts">';
    if(it.nav){
      acts += `<span class="mini nav" onclick="navTo('${it.nav.replace(/'/g,"\\'")}')">🧭 导航</span>`;
      acts += `<span class="mini" onclick="viewMap('${it.nav.replace(/'/g,"\\'")}')">📍 查看</span>`;
    }
    if(book){
      const cls = book.pr==='hi'?'hi':book.pr==='mid'?'mid':'lo';
      acts += `<span class="mini lock" onclick="gotoReminder('${it.book}')">🔔 ${book.pr==='hi'?'必抢':book.pr==='mid'?'建议提前':'可到蓉再办'}</span>`;
    }
    acts += '</div>';
    h += acts;
    if(book){
      const cls = book.pr==='hi'?'hi':book.pr==='mid'?'mid':'lo';
      h += `<span class="booktag ${cls}">${book.pr==='hi'?'🔴':book.pr==='mid'?'🟠':'🟢'} ${book.title} · ${book.adv}</span>`;
    }
    h += `</div>`;
  });
  h += `</div>`;
  if(d.stay) h += `<div class="stay">🏨 ${d.stay}</div>`;
  h += `</div>`;
  $('#dayDetail').innerHTML = h;
}

/* ---- 渲染提醒 ---- */
function renderReminders(){
  const groups = [['hi','🔴 高优先级（订不到直接打乱行程）'],['mid','🟠 中优先级（建议提前买，省排队防售罄）'],['lo','🟢 低优先级（到成都再安排）']];
  const done = JSON.parse(localStorage.getItem('cd_done')||'{}');
  let h='';
  groups.forEach(([pr,title])=>{
    const items = Object.entries(BOOKS).filter(([k,v])=>v.pr===pr);
    if(!items.length) return;
    h += `<div class="rem"><div class="rt"><span class="pr ${pr}">${pr==='hi'?'高':pr==='mid'?'中':'低'}</span>${title}</div>`;
    items.forEach(([k,v])=>{
      const isDone = done[k];
      h += `<div class="ritem ${isDone?'done':''}" id="ri-${k}">
        <div class="cb" onclick="toggleDone('${k}')">${isDone?'✓':''}</div>
        <div class="txt"><b>${v.title}</b><div style="font-weight:400;color:var(--mut);margin-top:2px">${v.detail}</div>
          <div class="meta"><span>⏰ <b>${v.adv}</b></span><span>📱 ${v.ch}</span></div>
        </div></div>`;
    });
    h += `</div>`;
  });
  $('#reminders').innerHTML = h;
}
function toggleDone(k){
  const done = JSON.parse(localStorage.getItem('cd_done')||'{}');
  done[k] = !done[k];
  localStorage.setItem('cd_done', JSON.stringify(done));
  const el = document.getElementById('ri-'+k);
  if(el) el.classList.toggle('done', done[k]);
  const cb = el? el.querySelector('.cb'):null;
  if(cb) cb.textContent = done[k]?'✓':'';
}
function gotoReminder(k){
  document.getElementById('reminders').scrollIntoView({behavior:'smooth'});
  const el = document.getElementById('ri-'+k);
  if(el){ el.style.transition='background .3s'; el.style.background='#fff7ed';
    setTimeout(()=>el.style.background='',1200); }
}

/* ---- 预算 ---- */
function renderBudget(){
  let h='';
  BUDGET.forEach(([k,v,note],i)=>{
    const total = i===BUDGET.length-1;
    h += `<div class="brow ${total?'total':''}"><span class="k">${k}${note?` <span style="font-size:11px">(${note})</span>`:''}</span><span class="v">${v}</span></div>`;
  });
  $('#budget').innerHTML = h;
}

  if(/sun|clear/i.test(t)) return '☀️';
  if(/partly|cloud/i.test(t) ) return '⛅';
  if(/overcast|cloud/i.test(t)) return '☁️';
  if(/rain/i.test(t)) return '🌧️';
  if(/thunder/i.test(t)) return '⛈️';
  if(/snow/i.test(t)) return '❄️';
  if(/fog|mist/i.test(t)) return '🌫️';
  return '🌤️';
}
function weatherZh(desc){
  const t = (desc||'').toLowerCase();
  if(/thunder|storm/i.test(t)) return '雷阵雨';
  if(/heavy rain|rainstorm/i.test(t)) return '大雨';
  if(/light rain|drizzle|shower/i.test(t)) return '小雨';
  if(/rain/i.test(t)) return '雨';
  if(/snow/i.test(t)) return '雪';
  if(/partly cloudy/i.test(t)) return '多云';
  if(/overcast|cloudy/i.test(t)) return '阴';
  if(/fog|mist/i.test(t)) return '雾';
  if(/clear|sun/i.test(t)) return '晴';
  return '天气未知';
}
async function refreshWeather(){
  const card = $('#weatherLive');
  const c = dayCity();
  $('#wPlace').textContent = c.name;
  card.style.display='block';
  card.classList.remove('err');
  $('#wSub').textContent = '加载中…';
  try{
    const r = await fetch(`https://wttr.in/${c.city}?format=j1&lang=zh`);
    if(!r.ok) throw 0;
    const j = await r.json();
    const cur = j.current_condition[0];
    if(!cur || !cur.temp_C) throw 0;
    $('#wTemp').textContent = (cur.temp_C|0)+'°';
    const desc = (cur.weatherDesc&&cur.weatherDesc[0]&&cur.weatherDesc[0].value)||'';
    $('#wEmoji').textContent = weatherEmoji(desc);
    $('#wSub').innerHTML = `<span>🌡️ 体感 ${cur.FeelsLikeC|0}°</span><span>💨 ${cur.windspeedKmph||'-'}km/h ${cur.winddir16Point||''}</span><span>💧 ${cur.humidity||'-'}%</span>`;
    $('#wDate').textContent = (j.current_condition[0].localObsDateTime||j.current_condition[0].observation_time||'') + ' · ' + weatherZh(desc);
  }catch(e){
    card.classList.add('err');
    $('#wTemp').textContent='--';
    $('#wSub').textContent='☹️ 天气加载失败，点右下角重试';
    $('#wEmoji').textContent='🌧️';
  }
}

/* ---- 倒计时 ---- */
function renderCountdown(){
  const today = new Date(); const start = new Date(2026,7,31);
  const diff = Math.ceil((start-today)/86400000);
  let msg;
  if(diff>0) msg = `🎋 距离出发还有 <b>${diff}</b> 天，先抢票订酒店最稳～`;
  else if(diff===0) msg = `🐼 今天出发！玩得开心～`;
  else msg = `✈️ 旅程进行中 / 已结束，慢慢回味～`;
  $('#countdown').innerHTML = msg;
}

/* ---- init ---- */
loadState();
renderChips();
renderDay();
renderReminders();
renderBudget();
renderCountdown();
refreshWeather();
</script>
